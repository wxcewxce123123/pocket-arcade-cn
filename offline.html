<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff684d" />
    <title>暂时离线 · 口袋电玩城</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; color: #20201f; background: #f4efe6; }
      main { width: min(100%, 520px); padding: 42px 30px; text-align: center; border: 2px solid #20201f; border-radius: 32px; background: #ffd84f; box-shadow: 9px 10px 0 #20201f; }
      .mark { width: 88px; height: 88px; margin: 0 auto 22px; display: grid; place-items: center; border: 2px solid #20201f; border-radius: 30px; background: #ff684d; box-shadow: 5px 6px 0 #20201f; font-size: 44px; }
      h1 { margin: 0; font-size: clamp(36px, 10vw, 58px); line-height: 1; letter-spacing: -.06em; }
      p { margin: 20px auto 26px; max-width: 360px; line-height: 1.7; }
      a { display: inline-block; padding: 14px 22px; color: white; background: #20201f; border-radius: 999px; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>信号去旅行了</h1>
      <p>首次完整打开站点后，游戏资源会保存在本机。请恢复网络再试一次，之后就能离线回来玩。</p>
      <a href="/pocket-arcade-cn/">重新连接</a>
    </main>
  </body>
</html>
