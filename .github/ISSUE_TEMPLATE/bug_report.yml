name: Bug 报告
description: 报告可以稳定复现的游戏、显示或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿在公开 Issue 中填写账号、密钥或其他私人信息。
  - type: input
    id: game
    attributes:
      label: 游戏或页面
      description: 问题出现在哪款游戏或哪个页面？
      placeholder: 例如：星点冲刺 / 首页
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出如何触发问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: 例如：iPhone 15 / iOS 19 / Safari
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 可以添加不含私人信息的截图、录屏或补充说明。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现同一问题。
          required: true
        - label: 我没有在此处公开私人信息或安全漏洞细节。
          required: true
